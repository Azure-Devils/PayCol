spring.application.name=centinela-api
server.port=8081

# --- Azure Cosmos DB (motor de persistencia actual, ver docs/decisions/001-migracion-postgresql-a-cosmosdb.md) ---
# "endpoint" es la URL de la cuenta Cosmos (ej. https://centinela-cosmos.documents.azure.com:443/).
# Nunca se hardcodea: viene de variable de entorno o, en Azure, de Managed Identity.
# "key" solo se necesita para desarrollo local contra el Cosmos DB Emulator; en Azure real
# se debe preferir autenticación Azure AD (DefaultAzureCredential/Managed Identity) y dejar
# esta propiedad vacía, igual que ya se hace con Azure Queue/Blob en este proyecto.
spring.cloud.azure.cosmos.endpoint=${AZURE_COSMOS_ENDPOINT:}
spring.cloud.azure.cosmos.key=${AZURE_COSMOS_KEY:}
spring.cloud.azure.cosmos.database=${AZURE_COSMOS_DATABASE:centinela}
# Nivel de consistencia "Session": el más fuerte que sigue estando incluido en el free tier
# de Cosmos DB sin costo adicional; suficiente para leer-tu-propia-escritura dentro de un
# mismo cliente, que es lo que necesita la ingesta de transacciones.
spring.cloud.azure.cosmos.consistency-level=SESSION

# --- PostgreSQL (motor ANTERIOR, aislado detrás del perfil "postgres-legacy") ---
# Se conserva solo para referencia/rollback. No se activa por defecto: para usarlo habría
# que levantar el perfil Spring "postgres-legacy" Y quitar las exclusiones de
# autoconfiguración de abajo. Ver PostgresTransactionRepositoryAdapter.
#spring.datasource.url=jdbc:postgresql://localhost:5432/centinela
#spring.datasource.username=centinela
#spring.datasource.password=centinela
#spring.datasource.driver-class-name=org.postgresql.Driver
#spring.jpa.hibernate.ddl-auto=validate
#spring.jpa.open-in-view=false
#spring.jpa.properties.hibernate.jdbc.time_zone=UTC
#spring.flyway.enabled=true
#spring.flyway.locations=classpath:db/migration

# Con spring-boot-starter-data-jpa, postgresql y flyway-core todavía en el classpath (se
# conservan para que el adapter Postgres aislado siga compilando), Spring Boot intentaría
# igual autoconfigurar un DataSource y correr Flyway al arrancar, y fallaría exactamente
# como falló antes de esta migración (Connection to localhost:5432 refused) aunque ya no
# se use Postgres. Estas exclusiones apagan esa autoconfiguración por defecto.
spring.autoconfigure.exclude=org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration,org.springframework.boot.autoconfigure.orm.jpa.JpaRepositoriesAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration,org.springframework.boot.autoconfigure.jdbc.DataSourceTransactionManagerAutoConfiguration,org.springframework.boot.autoconfigure.flyway.FlywayAutoConfiguration

# --- Anti-polución de payloads (ver especificaciones.md, sección 4.2) ---
spring.jackson.deserialization.fail-on-unknown-properties=true
