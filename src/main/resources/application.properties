spring.application.name=centinela-api
server.port=8081

# --- PostgreSQL local (Docker, ver docker-compose.yml) ---
spring.datasource.url=jdbc:postgresql://localhost:5432/centinela
spring.datasource.username=centinela
spring.datasource.password=centinela
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA / Hibernate ---
# El esquema lo gestiona Flyway (V1__init.sql), Hibernate solo valida que coincida.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

# --- Flyway ---
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

# --- Anti-polución de payloads (ver especificaciones.md, sección 4.2) ---
spring.jackson.deserialization.fail-on-unknown-properties=true
