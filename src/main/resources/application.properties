spring.application.name=centinela-api
server.port=8081

# Virtual Threads (Java 21): usadas por Tomcat para las peticiones HTTP y por los
# TaskScheduler de @Scheduled (consumidores de cola, Semana 2) — I/O concurrente
# barato sin necesidad de dimensionar un pool de hilos de plataforma a mano.
spring.threads.virtual.enabled=true

# --- Azure Cosmos DB (motor de persistencia de transacciones + scores) ---
# "endpoint" es la URL de la cuenta Cosmos (ej. https://centinela-cosmos.documents.azure.com:443/).
# Nunca se hardcodea: viene de variable de entorno o, en Azure, de Managed Identity.
# "key" solo se necesita para desarrollo local contra el Cosmos DB Emulator; en Azure real
# se debe preferir autenticación Azure AD (DefaultAzureCredential/Managed Identity) y dejar
# esta propiedad vacía, igual que ya se hace con Azure Queue/Blob en este proyecto.
spring.cloud.azure.cosmos.endpoint=${AZURE_COSMOS_ENDPOINT:}
spring.cloud.azure.cosmos.key=${AZURE_COSMOS_KEY:}
spring.cloud.azure.cosmos.database=${AZURE_COSMOS_DATABASE:centinela}
# Nivel de consistencia "Session": el más fuerte que sigue estando incluido en el free tier
# de Cosmos DB sin costo adicional; suficiente para leer-tu-propia-escritura dentro de un
# mismo cliente (necesario para que la ingesta idempotente vea su propia escritura, y para
# que el motor de scoring -en el mismo proceso- vea la transacción recién insertada al
# consultar el historial de la cuenta).
spring.cloud.azure.cosmos.consistency-level=SESSION

# --- Azure Storage Queue (Semana 2: mensajería real, ver AzureQueueClients) ---
# Endpoint de la cuenta de Storage (ej. https://centinelastorage.queue.core.windows.net/).
# Autenticación SIEMPRE vía DefaultAzureCredentialBuilder (Managed Identity/az login) — nunca
# connection string ni account key. Placeholder vacío hasta que el equipo de DevOps/Infra provisione la
# cuenta real (mismo patrón que AZURE_COSMOS_ENDPOINT); con el placeholder vacío, la app
# arranca igual en modo degradado (ver AzureQueueClients).
azure.queue.endpoint=${AZURE_STORAGE_QUEUE_ENDPOINT:}
# Distribución del evento de transacción: sin garantía de procesamiento (ver MessageQueuePort).
azure.queue.transaction-events-name=${AZURE_QUEUE_TRANSACTION_EVENTS_NAME:transaction-events}
azure.queue.transaction-events-poll-interval-ms=${AZURE_QUEUE_TRANSACTION_EVENTS_POLL_INTERVAL_MS:2000}
azure.queue.transaction-events-max-messages-per-poll=${AZURE_QUEUE_TRANSACTION_EVENTS_MAX_MESSAGES:10}
azure.queue.transaction-events-visibility-timeout-seconds=${AZURE_QUEUE_TRANSACTION_EVENTS_VISIBILITY_SECONDS:30}
# Cola de casos marcados: SÍ requiere garantía de no pérdida (ver FraudCaseQueuePort y
# FraudCaseQueueConsumer, que solo borra el mensaje tras persistir el caso con éxito).
azure.queue.fraud-cases-name=${AZURE_QUEUE_FRAUD_CASES_NAME:fraud-cases}
azure.queue.fraud-cases-poll-interval-ms=${AZURE_QUEUE_FRAUD_CASES_POLL_INTERVAL_MS:3000}
azure.queue.fraud-cases-max-messages-per-poll=${AZURE_QUEUE_FRAUD_CASES_MAX_MESSAGES:10}
azure.queue.fraud-cases-visibility-timeout-seconds=${AZURE_QUEUE_FRAUD_CASES_VISIBILITY_SECONDS:60}

# --- Azure Blob Storage (comprobantes PDF de transacciones) ---
# Endpoint de la cuenta de Storage (ej. https://stcentineladev010.blob.core.windows.net/).
# Autenticación SIEMPRE vía DefaultAzureCredentialBuilder (Managed Identity) — nunca
# connection string ni account key. Placeholder vacío hasta que el equipo de DevOps/Infra
# provisione el container real; con el placeholder vacío, la app arranca igual en modo
# degradado (ver AzureBlobReceiptStorageAdapter): la ingesta sigue funcionando, simplemente
# no se generan ni sirven comprobantes.
azure.blob.endpoint=${AZURE_STORAGE_BLOB_ENDPOINT:}
azure.blob.receipts-container-name=${AZURE_STORAGE_RECEIPTS_CONTAINER_NAME:transaction-receipts}

# --- Azure Key Vault (Semana 2: umbral de scoring modificable sin redeploy) ---
# Ver KeyVaultScoringThresholdAdapter: el secreto se lee en cada evaluación, nunca cacheado.
# Placeholder vacío hasta que el equipo de DevOps/Infra provisione el Key Vault real; mientras tanto se usa
# el valor de respaldo "centinela.scoring.threshold" de abajo.
# Nombre de secreto alineado con infra/key-vault.bicep (el equipo de DevOps/Infra): "fraud-threshold".
azure.keyvault.endpoint=${AZURE_KEYVAULT_ENDPOINT:}
azure.keyvault.scoring-threshold-secret-name=${AZURE_KEYVAULT_SCORING_THRESHOLD_SECRET_NAME:fraud-threshold}

# --- Motor de scoring (Semana 2, ver docs/weeks/Semana2-Azure.md sección 2.3) ---
# Umbral de score a partir del cual una transacción abre un caso de fraude. 60 se eligió
# como punto medio conservador: la regla más "barata" que puede activarse sola (monto
# atípico, 25 pts, o velocidad, 30 pts) nunca abre un caso por sí sola: hace falta que se
# combinen al menos dos señales (o que se active la señal más fuerte, comercio de riesgo,
# 50 pts, junto con cualquier otra) — reduce falsos positivos de una sola regla ruidosa a
# costa de exigir corroboración cruzada. Ver justificación completa en
# docs/decisions/002-semana2-scoring-mensajeria-y-casos.md. Se usa SOLO como respaldo si
# Key Vault no está configurado (ver azure.keyvault.endpoint arriba).
centinela.scoring.threshold=${CENTINELA_SCORING_THRESHOLD:60}
# Cuántas transacciones recientes de la cuenta (ordenadas de la más nueva a la más vieja,
# dentro de la misma partición customerId) consulta el motor por cada evaluación. Acota el
# consumo de RU sin importar la antigüedad de la cuenta -- ver CosmosTransactionDocument
# para la relación con la política de expiración (TTL).
centinela.scoring.history-limit=${CENTINELA_SCORING_HISTORY_LIMIT:50}
# Regla de VELOCIDAD: N o más transacciones en una ventana corta.
centinela.scoring.rules.velocity.window-seconds=${CENTINELA_SCORING_VELOCITY_WINDOW_SECONDS:120}
centinela.scoring.rules.velocity.max-transactions=${CENTINELA_SCORING_VELOCITY_MAX_TX:5}
centinela.scoring.rules.velocity.points=${CENTINELA_SCORING_VELOCITY_POINTS:30}
# Regla de MONTO ATÍPICO: monto >= multiplicador * promedio histórico, con muestra mínima.
centinela.scoring.rules.anomalous-amount.min-sample-size=${CENTINELA_SCORING_AMOUNT_MIN_SAMPLE:3}
centinela.scoring.rules.anomalous-amount.deviation-multiplier=${CENTINELA_SCORING_AMOUNT_MULTIPLIER:5.0}
centinela.scoring.rules.anomalous-amount.points=${CENTINELA_SCORING_AMOUNT_POINTS:25}
# Regla de GEO-IMPOSIBLE: velocidad implícita entre dos transacciones consecutivas por
# encima de lo físicamente plausible (900 km/h ~ más rápido que un vuelo comercial).
centinela.scoring.rules.impossible-geo.max-plausible-speed-kmh=${CENTINELA_SCORING_GEO_MAX_SPEED_KMH:900.0}
centinela.scoring.rules.impossible-geo.points=${CENTINELA_SCORING_GEO_POINTS:40}
# Regla de COMERCIO DE RIESGO: listas separadas por coma de merchantId/merchantCategory
# marcados. Vacío por defecto (sin comercios marcados) hasta que exista un proceso de
# negocio real que alimente esta lista.
centinela.scoring.rules.risky-merchant.merchant-ids=${CENTINELA_SCORING_RISKY_MERCHANT_IDS:}
centinela.scoring.rules.risky-merchant.merchant-categories=${CENTINELA_SCORING_RISKY_MERCHANT_CATEGORIES:}
centinela.scoring.rules.risky-merchant.points=${CENTINELA_SCORING_RISKY_MERCHANT_POINTS:50}

# --- Control de tasa de la API de ingesta (Semana 2, ver RateLimitFilter) ---
centinela.ratelimit.burst-capacity=${CENTINELA_RATELIMIT_BURST_CAPACITY:10}
centinela.ratelimit.burst-window-seconds=${CENTINELA_RATELIMIT_BURST_WINDOW_SECONDS:1}
centinela.ratelimit.sustained-capacity=${CENTINELA_RATELIMIT_SUSTAINED_CAPACITY:60}
centinela.ratelimit.sustained-window-seconds=${CENTINELA_RATELIMIT_SUSTAINED_WINDOW_SECONDS:60}

# --- Almacén de CASOS de fraude (Cosmos DB, container "cases") ---
# PostgreSQL se eliminó por completo del proyecto — ver
# docs/decisions/004-eliminacion-postgresql-casos-a-cosmos.md. Los casos de fraude viven en
# el mismo motor y la misma base de datos que transactions/customers (ver
# spring.cloud.azure.cosmos.* arriba); no hace falta ninguna propiedad nueva aquí porque el
# nombre del container ("cases") va hardcodeado en @Container, igual que "transactions" y
# "customers" (ver CosmosFraudCaseDocument).

# --- Anti-polución de payloads (ver especificaciones.md, sección 4.2) ---
spring.jackson.deserialization.fail-on-unknown-properties=true
